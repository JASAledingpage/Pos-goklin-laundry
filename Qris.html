<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRIS GOKLin Laundry</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white flex flex-col items-center justify-center min-h-screen p-5">
  <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full text-center shadow-2xl space-y-4">
    <h1 class="text-base font-black text-amber-400">GÖKLin LAUNDRY</h1>
    <p class="text-xs text-slate-400">Silakan scan QRIS di bawah ini atau simpan ke galeri untuk pembayaran.</p>
    
    <!-- Gambar QRIS -->
    <div class="bg-white p-3 rounded-2xl inline-block shadow-inner">
      <img src="qris.png" alt="QRIS GOKLin" class="w-64 h-64 object-contain mx-auto rounded-lg">
    </div>

    <!-- Tombol Simpan Otomatis ke Galeri -->
    <a href="qris.png" download="QRIS-GOKLin-Laundry.png" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3.5 px-4 rounded-xl block text-xs shadow-lg transition active:scale-95">
      📥 Simpan QRIS ke Galeri HP
    </a>
    
    <p class="text-[10px] text-slate-500">Purwokerto • Aman & Cepat</p>
  </div>
</body>
</html>
